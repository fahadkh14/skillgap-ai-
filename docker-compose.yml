services:
  mongodb:
    image: mongo:8
    container_name: skillgap-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongodb_data:/data/db
    networks:
      - skillgap-network
    healthcheck:
      test: >
        mongosh --quiet
        -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD
        --authenticationDatabase admin
        --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # MongoDB is intentionally NOT published to the host.
    # Only backend/mongodb communicate over the internal Docker network.

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: skillgap-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "${BACKEND_PORT}:5678"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - skillgap-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5678/api/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillgap-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - skillgap-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  skillgap-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
