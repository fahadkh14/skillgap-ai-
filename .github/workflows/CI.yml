name: SkillGap-Ai

on:
  push:

jobs:
  frontend-ci:
    name: Frontend CI 
    runs-on: ubuntu-latest

    steps:
      
        - name: Code Checkout
          uses: actions/checkout@v4

        - name: Setup Node JS 
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm 
            cache-dependency-path: frontend/package.json


        - name: Install Dependencies
          run: npm ci
          working-directory: frontend

        - name: Run Linter
          run: npm run Linter
          working-directory: frontend

          