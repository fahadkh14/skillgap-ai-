# Secret using GitLeaks

name: Secret Scanning

on:
  workflow_call:

jobs:
  sercet-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
            GITHUB_TOKEN: ${{ sercets.GITHUB_TOKEN }}
