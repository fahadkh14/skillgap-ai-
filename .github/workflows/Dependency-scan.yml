# Goal - I have to ensure the packages & dependencies
# have been audited for security

name: Dependency Scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:

      # Checkout the source code from the GitHub repository
      - name: Code Checkout
        uses: actions/checkout@v7

      # ================================================= 
      # PYTHON DEPENDENCY SECURITY SCAN 
      # =================================================  

      # Python Dependency Scan
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

        # Install pip-audit, a tool that checks Python 
        # dependencies for known security vulnerabilities.
      - name: Install pip-audit
        run: pip install pip-audit

      # Scan all packages listed in backend/requirements.txt
      # for known vulnerabilities.
      - name: Python Dependency Scan
        run: pip-audit -r requirements.txt
        working-directory: backend

      # ================================================= 
      # NODE.JS / NPM DEPENDENCY SECURITY SCAN 
      # =================================================

        # Set up the Node.js environment required 
        # for installing and auditing frontend dependencies.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

        # Install the exact frontend dependencies defined 
        # in package-lock.json.
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      # Run npm audit to identify known security 
      # vulnerabilities in Node.js dependencies.
      - name: Node.js Dependency Scan
        run: npm audit
        working-directory: frontend